name: Pruebas

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"
      - name: Ejecutar las pruebas
        run: pytest -q
