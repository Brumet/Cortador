name: Construir la app

# Crea los ejecutables de escritorio y los publica en una Release.
# Se dispara al empujar una etiqueta (v1.0.0, v1.0.1...) o a mano desde
# la pestana Actions de GitHub.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        include:
          - so: windows-latest
            nombre: Cortador-Windows.exe
            origen: dist/Cortador.exe
          - so: ubuntu-latest
            nombre: Cortador-Linux
            origen: dist/Cortador
    runs-on: ${{ matrix.so }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web]"
          pip install pyinstaller

      - name: Construir el ejecutable
        run: python packaging/construir.py

      - name: Renombrar
        shell: bash
        run: mv "${{ matrix.origen }}" "${{ matrix.nombre }}"

      - name: Comprobar que arranca
        shell: bash
        run: |
          ./"${{ matrix.nombre }}" --comprobar

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.nombre }}
          retention-days: 30

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: descargas
      - name: Preparar los archivos
        run: |
          mkdir -p publicar
          find descargas -type f -exec cp {} publicar/ \;
          ls -la publicar
      - name: Crear la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" publicar/* \
            --title "Cortador ${GITHUB_REF_NAME}" \
            --notes-file .github/notas-release.md \
            --latest || \
          gh release upload "${GITHUB_REF_NAME}" publicar/* --clobber
