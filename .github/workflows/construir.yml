name: Construir la app

# Crea los ejecutables de escritorio y publica la Release con ellos.
# Se dispara al empujar una etiqueta (v0.1.0, v0.2.0...) o a mano desde la
# pestana Actions -> Construir la app -> Run workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar (etiqueta que se creara)"
        required: false
        default: "v0.1.0"
      publicar:
        description: "Crear la Release con los ejecutables"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        include:
          - so: windows-latest
            nombre: Cortador-Windows.exe
            origen: dist/Cortador.exe
          - so: ubuntu-latest
            nombre: Cortador-Linux
            origen: dist/Cortador
    runs-on: ${{ matrix.so }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,app]"
          pip install pyinstaller

      - name: Construir el ejecutable portable
        run: python packaging/construir.py

      - name: Comprobar que arranca
        shell: bash
        run: |
          set -e
          ./"${{ matrix.origen }}" --comprobar | tee comprobacion.txt
          grep -q "registro       : " comprobacion.txt || {
            echo "::error::El ejecutable no escribe registro de arranque"
            exit 1
          }

      - name: Comprobar el diagnostico
        shell: bash
        run: |
          set -e
          ./"${{ matrix.origen }}" --diagnostico > diagnostico.txt
          cat diagnostico.txt

      - name: Comprobar que hay ventana de escritorio (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          grep -q "ventana        : si" diagnostico.txt || {
            echo "::error::El ejecutable no encuentra motor de ventana: abriria el navegador"
            exit 1
          }

      - name: Renombrar el portable
        shell: bash
        run: mv "${{ matrix.origen }}" "${{ matrix.nombre }}"

      - name: Construir la version de carpeta (Windows)
        if: runner.os == 'Windows'
        run: python packaging/construir.py --carpeta

      - name: Comprobar la version de carpeta (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          ./dist/Cortador/Cortador.exe --comprobar
          ./dist/Cortador/Cortador.exe --diagnostico > diagnostico-carpeta.txt
          cat diagnostico-carpeta.txt
          grep -q "ventana        : si" diagnostico-carpeta.txt || {
            echo "::error::La version instalable no encuentra motor de ventana"
            exit 1
          }

      - name: Construir el instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = "${{ inputs.version || github.ref_name }}" -replace '^v',''
          if (-not $version) { $version = "0.0.0" }
          & $iscc "/DMiVersion=$version" "packaging\cortador.iss"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.nombre }}
          retention-days: 90

      - name: Subir el instalador
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Cortador-Setup.exe
          path: dist/Cortador-Setup.exe
          retention-days: 90

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: descargas

      - name: Preparar los archivos
        run: |
          mkdir -p publicar
          find descargas -type f -exec cp {} publicar/ \;
          chmod +x publicar/Cortador-Linux || true
          ls -la publicar

      - name: Publicar la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -e
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" publicar/* --clobber
          else
            gh release create "$VERSION" publicar/* \
              --target "${GITHUB_SHA}" \
              --title "Cortador $VERSION" \
              --notes-file .github/notas-release.md \
              --latest
          fi
          echo "Release publicada: $(gh release view "$VERSION" --json url -q .url)"
