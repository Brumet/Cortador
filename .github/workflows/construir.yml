name: Construir la app

# Crea los ejecutables de escritorio y publica la Release con ellos.
# Se dispara al empujar una etiqueta (v0.1.0, v0.2.0...) o a mano desde la
# pestana Actions -> Construir la app -> Run workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar (etiqueta que se creara)"
        required: false
        default: "v0.1.0"
      publicar:
        description: "Crear la Release con los ejecutables"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        include:
          - so: windows-latest
            nombre: Cortador-Windows.exe
            origen: dist/Cortador.exe
          - so: ubuntu-latest
            nombre: Cortador-Linux
            origen: dist/Cortador
    runs-on: ${{ matrix.so }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,app]"
          pip install pyinstaller

      - name: Construir el ejecutable portable
        run: python packaging/construir.py

      - name: Comprobar que arranca
        shell: bash
        run: |
          set -e
          ./"${{ matrix.origen }}" --comprobar | tee comprobacion.txt
          grep -q "registro       : " comprobacion.txt || {
            echo "::error::El ejecutable no escribe registro de arranque"
            exit 1
          }

      - name: Comprobar el diagnostico
        shell: bash
        run: |
          set -e
          ./"${{ matrix.origen }}" --diagnostico > diagnostico.txt
          cat diagnostico.txt

      - name: Comprobar que hay ventana de escritorio (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          grep -q "ventana        : si" diagnostico.txt || {
            echo "::error::El ejecutable no encuentra motor de ventana: abriria el navegador"
            exit 1
          }

      - name: Renombrar el portable
        shell: bash
        run: mv "${{ matrix.origen }}" "${{ matrix.nombre }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.nombre }}
          retention-days: 90

  escritorio:
    # La aplicacion de escritorio de verdad: Electron (su propio Chromium) con
    # el motor de Python oficial embebido dentro. Es la misma receta que ya
    # funciona en Brumet Slicer, sin PyInstaller ni WebView2 de por medio.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Armar el motor (Python embebido + Cortador)
        run: |
          python -m pip install --upgrade pip
          python packaging/motor_embebido.py

      - name: Poner la version en la app
        shell: bash
        run: |
          set -e
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          [ -n "$version" ] || version="0.0.0"
          cd escritorio
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Construir el instalador
        working-directory: escritorio
        run: |
          npm install
          npx electron-builder --win --publish never

      - name: Ver lo construido
        shell: bash
        run: ls -la escritorio/dist

      - name: Comprobar que la ventana abre de verdad
        shell: pwsh
        run: |
          # Se arranca la app ya construida y se le pide una foto de su ventana:
          # si no aparece, es que no abre, y entonces no se publica nada.
          $exe = "escritorio\dist\win-unpacked\Cortador.exe"
          if (-not (Test-Path $exe)) { throw "no encuentro $exe" }
          $foto = Join-Path $PWD "ventana.png"
          $env:CORTADOR_CAPTURA = $foto
          $proceso = Start-Process -FilePath $exe -PassThru
          $limite = (Get-Date).AddSeconds(150)
          while ((Get-Date) -lt $limite -and -not (Test-Path $foto)) {
            Start-Sleep -Seconds 3
          }
          if (-not (Test-Path $foto)) {
            if (-not $proceso.HasExited) { $proceso.Kill() }
            Get-Content "$env:LOCALAPPDATA\Cortador\arranque.log" -ErrorAction SilentlyContinue
            throw "La ventana no llego a abrirse"
          }
          Get-Content "$env:LOCALAPPDATA\Cortador\arranque.log"
          Write-Host "Ventana abierta y capturada: $((Get-Item $foto).Length) bytes"

      - name: Guardar la foto de la ventana
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ventana-windows
          path: ventana.png
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Cortador-Setup
          path: escritorio/dist/Cortador-Setup.exe
          retention-days: 90

  publicar:
    needs: [construir, escritorio]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: descargas

      - name: Preparar los archivos
        run: |
          mkdir -p publicar
          find descargas -type f -exec cp {} publicar/ \;
          chmod +x publicar/Cortador-Linux || true
          ls -la publicar

      - name: Publicar la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -e
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" publicar/* --clobber
          else
            gh release create "$VERSION" publicar/* \
              --target "${GITHUB_SHA}" \
              --title "Cortador $VERSION" \
              --notes-file .github/notas-release.md \
              --latest
          fi
          echo "Release publicada: $(gh release view "$VERSION" --json url -q .url)"
